services:
  postgres:
    image: postgres:17
    container_name: mec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mec
      POSTGRES_PASSWORD: mec_dev_password
      POSTGRES_DB: mec
    ports:
      - '5432:5432'
    volumes:
      - mec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mec -d mec']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mec_postgres_data:
