# SonarQube Cloud analysis configuration.
# The token is supplied as the SONAR_TOKEN GitHub Actions secret, never here.
sonar.projectKey=majdm777_Music-Education-Center
sonar.organization=majdm777
sonar.projectName=Music-Education-Center

# Source code that Sonar analyses for bugs, code smells, vulnerabilities and duplication.
sonar.sources=apps/api/src,apps/api/prisma,apps/web/src,packages/shared/src,scripts

# Test code. Kept disjoint from sonar.sources so tests are classified correctly.
sonar.tests=apps/api/test,packages/shared/test,apps/web/test

# @mec/shared and the web UI primitives have unit tests. apps/api is excluded
# from coverage (it is still analysed for bugs, smells, security and
# duplication) until feature work adds unit tests there. Integration tests need
# a live database and are not part of the coverage report. Web route files and
# the health card are wiring exercised by the browser health check and future
# Playwright tests, so they stay out of the unit-coverage report.
sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=apps/api/**,apps/web/src/app/**,apps/web/src/components/health-card.tsx,packages/shared/src/index.ts,scripts/**,**/*.test.ts,**/*.test.tsx,**/*.config.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,**/*.tsbuildinfo,pnpm-lock.yaml,**/*.sql
# SonarQube Cloud has no PostgreSQL analyzer: .sql files are parsed as Oracle
# PL/SQL, which reports false positives such as btrim(x) <> '' being treated as
# a compare-to-NULL. Migrations are enforced by db:verify, db:drift, and the
# integration tests, so they are excluded from static analysis.
sonar.sourceEncoding=UTF-8

# Fail the CI job when the quality gate fails, so the PR check reflects the gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
